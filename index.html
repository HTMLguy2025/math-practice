<!DOCTYPE html>

<html lang="en">
<head>
    <!-- Change const CURRENT_VERSION when pushing new changes to repository. This is important! -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="icon" href="newicon.png" type="image/x-icon">
    <script src="version.js"></script>
    <script src="dev-test.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <title>MP Launcher</title>
    <style>
        * {
            font-family: 'Roboto Mono', monospace;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            position: relative;
            background-color: #12121f;
            color: rgb(190, 205, 218);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            padding-top: 8rem;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 600;
            position: absolute;
            top: 2.5rem;
            left: 0;
            right: 0;
            text-align: center;
            opacity: 0;
            animation: fadeInOpacity 0.5s ease forwards;
        }

        /* Selection area */

        #selectionArea {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-label {
            font-size: 0.85rem;
            color: rgba(190, 205, 218, 0.45);
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
        }

        .levels-label {
            margin-top: 2rem;
        }

        #mainView {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            opacity: 0;
            animation: fadeIn 0.5s ease 0.2s forwards;
        }

        #simpleGrid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
        }

        #levelGrid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .level-btn {
            width: 180px;
            padding: 11px 16px;
            font-size: 1rem;
            font-family: 'Roboto Mono', monospace;
            background-color: rgb(35, 50, 85);
            color: rgba(227, 234, 245, 0.9);
            border: none;
            cursor: pointer;
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            text-align: left;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        .level-btn:hover {
            background-color: rgb(52, 75, 120);
            box-shadow: 3.5px 3.5px 4px rgba(0, 0, 0, 0.5);
        }

        .level-btn:active {
            background-color: rgb(20, 32, 60);
            box-shadow: none;
        }

        #subOptions {
            display: none;
            flex-direction: column;
            align-items: flex-start;
            gap: 1.5rem;
        }

        .sub-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(190, 205, 218, 0.8);
        }

        .back-btn {
            font-size: 0.9rem;
            font-family: 'Roboto Mono', monospace;
            background: none;
            border: none;
            color: rgba(190, 205, 218, 0.45);
            cursor: pointer;
            align-self: flex-start;
            padding: 0;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: rgba(190, 205, 218, 0.9);
        }

        .mode-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
        }

        .mode-section {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.6rem;
        }

        .mode-label {
            font-size: 1rem;
            font-weight: 600;
            color: rgba(190, 205, 218, 0.75);
            margin-bottom: 0.2rem;
        }

        .launch-btn {
            display: block;
            width: 180px;
            padding: 11px 16px;
            font-size: 1rem;
            font-family: 'Roboto Mono', monospace;
            background-color: rgb(35, 50, 85);
            color: rgba(227, 234, 245, 0.9);
            border: none;
            cursor: pointer;
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            text-decoration: none;
            text-align: left;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        .launch-btn:hover {
            background-color: rgb(52, 75, 120);
            box-shadow: 3.5px 3.5px 4px rgba(0, 0, 0, 0.5);
        }

        .launch-btn:active {
            background-color: rgb(20, 32, 60);
            box-shadow: none;
        }

        .launch-btn.coming-soon {
            opacity: 0.3;
            cursor: default;
            pointer-events: none;
        }

        /* Group buttons */

        .group-btn {
            width: 180px;
            padding: 11px 16px;
            font-size: 1rem;
            font-family: 'Roboto Mono', monospace;
            background-color: rgb(35, 50, 85);
            color: rgba(227, 234, 245, 0.9);
            border: none;
            cursor: pointer;
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            text-align: left;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        .group-btn:hover {
            background-color: rgb(52, 75, 120);
            box-shadow: 3.5px 3.5px 4px rgba(0, 0, 0, 0.5);
        }

        .group-btn:active {
            background-color: rgb(20, 32, 60);
            box-shadow: none;
        }

        .group-btn.coming-soon {
            opacity: 0.3;
            cursor: default;
            pointer-events: none;
        }

        /* Checkbox panel */

        .check-panel {
            flex-direction: column;
            gap: 0.65rem;
            max-width: 340px;
        }

        .check-panel-title {
            font-size: 1rem;
            font-weight: 600;
            color: rgba(190, 205, 218, 0.8);
            margin-bottom: 0.15rem;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            cursor: pointer;
            user-select: none;
        }

        .check-item input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(190, 205, 218, 0.35);
            background: transparent;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .check-item input[type="checkbox"]:checked {
            background-color: rgb(52, 75, 120);
            border-color: rgb(90, 130, 200);
        }

        .check-item input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 3px;
            width: 5px;
            height: 8px;
            border: 2px solid rgba(200, 220, 255, 0.9);
            border-top: none;
            border-left: none;
            transform: rotate(45deg);
        }

        .check-item span {
            font-size: 0.95rem;
            color: rgba(227, 234, 245, 0.9);
        }

        .check-item.disabled {
            cursor: default;
            pointer-events: none;
        }

        .check-item.disabled span {
            opacity: 0.3;
        }

        .panel-back-btn {
            font-size: 0.9rem;
            font-family: 'Roboto Mono', monospace;
            background: none;
            border: none;
            color: rgba(190, 205, 218, 0.45);
            cursor: pointer;
            padding: 0;
            transition: color 0.2s;
            text-align: left;
            margin-bottom: 0.3rem;
        }

        .panel-back-btn:hover {
            color: rgba(190, 205, 218, 0.9);
        }

        .panel-sublabel {
            font-size: 0.8rem;
            color: rgba(190, 205, 218, 0.45);
            letter-spacing: 0.04em;
            margin-top: 0.2rem;
        }

        .check-item input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(190, 205, 218, 0.35);
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .check-item input[type="radio"]:checked {
            border-color: rgb(90, 130, 200);
        }

        .check-item input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 7px;
            height: 7px;
            background: rgb(90, 130, 200);
            border-radius: 50%;
        }

        .start-btn {
            margin-top: 0.4rem;
            width: 120px;
            padding: 10px 16px;
            font-size: 0.95rem;
            font-family: 'Roboto Mono', monospace;
            background-color: rgb(35, 68, 45);
            color: rgba(200, 230, 210, 0.9);
            border: none;
            cursor: pointer;
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            transition: background-color 0.2s, box-shadow 0.2s, opacity 0.2s;
        }

        .start-btn:hover:not(:disabled) {
            background-color: rgb(48, 90, 60);
            box-shadow: 3.5px 3.5px 4px rgba(0, 0, 0, 0.5);
        }

        .start-btn:active:not(:disabled) {
            background-color: rgb(25, 48, 32);
            box-shadow: none;
        }

        .start-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .fade-out-down {
            animation: fadeOutDown 0.15s ease forwards;
            pointer-events: none;
        }

        /* Launch area */

        #launchArea {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .spinner {
            width: 64px;
            height: 64px;
            border: 6px solid rgba(255, 255, 255, 0.15);
            border-top-color: rgb(60, 100, 170);
            border-radius: 50%;
            opacity: 0;
            animation: spin 0.8s linear infinite, fadeInOpacity 0.5s ease forwards;
        }

        .spinner.done {
            border-top-color: rgb(79, 117, 63);
        }

        .progress-bar-track {
            width: 240px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 2rem;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 0.5s ease 0.1s forwards;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: rgb(60, 100, 170);
            border-radius: 3px;
            transition: width 0.3s linear;
        }

        .status {
            margin-top: 1.5rem;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.6);
            opacity: 0;
            animation: fadeIn 0.5s ease 0.2s forwards;
        }

        /* Animations */

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInOpacity {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOutDown {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(10px); }
        }

        @keyframes bannerFadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(20px); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Update banner */

        #updateOverlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.45);
            opacity: 0;
            pointer-events: none;
        }

        #updateOverlay.show {
            animation: fadeInOpacity 0.5s ease 0.3s forwards;
            pointer-events: auto;
        }

        #updateBanner {
            position: fixed;
            inset: 2rem;
            background-color: #12121f;
            color: rgb(190, 205, 218);
            padding: 2rem 2.5rem;
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }

        #updateBanner.show {
            animation: fadeInOpacity 0.5s ease 0.3s forwards;
            pointer-events: auto;
        }

        #updateBanner .banner-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: rgba(227, 234, 245, 0.95);
            margin-bottom: 0.3rem;
        }

        #updateBanner .banner-text {
            font-size: 0.85rem;
            color: rgba(190, 205, 218, 0.6);
        }

        #updateBanner .banner-text > * + * {
            margin-top: 0.55rem;
        }

        #updateBanner .banner-text ul,
        #updateBanner .banner-text ol {
            padding-left: 1.4rem;
        }

        #updateBanner .banner-text li + li {
            margin-top: 0.25rem;
        }

        #updateBanner .banner-text h2,
        #updateBanner .banner-text h3 {
            color: rgba(227, 234, 245, 0.8);
            font-size: 0.9rem;
        }

        #updateBanner .banner-close {
            position: absolute;
            top: 0.6rem;
            right: 0.85rem;
            font-size: 1.2rem;
            color: rgba(190, 205, 218, 0.5);
            cursor: pointer;
            background: none;
            border: none;
            line-height: 1;
            padding: 0.4rem 0.5rem;
            transition: color 0.2s;
        }

        #updateBanner .banner-close:hover {
            color: rgba(190, 205, 218, 0.95);
        }

        .streak-info {
            font-size: 0.75rem;
            color: rgba(190, 205, 218, 0.6);
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            min-height: 16px;
        }

        @keyframes flame-flicker {
            0%   { transform: scaleX(1)    scaleY(1)    rotate(0deg); }
            8%   { transform: scaleX(0.91) scaleY(1.09) rotate(-2deg); }
            16%  { transform: scaleX(1.07) scaleY(0.94) rotate(1.5deg); }
            24%  { transform: scaleX(0.93) scaleY(1.07) rotate(-2.5deg); }
            33%  { transform: scaleX(1.06) scaleY(0.95) rotate(2deg); }
            42%  { transform: scaleX(0.90) scaleY(1.10) rotate(-1.5deg); }
            52%  { transform: scaleX(1.07) scaleY(0.94) rotate(1deg); }
            62%  { transform: scaleX(0.94) scaleY(1.06) rotate(-2deg); }
            72%  { transform: scaleX(1.08) scaleY(0.93) rotate(2.5deg); }
            82%  { transform: scaleX(0.95) scaleY(1.05) rotate(-1deg); }
            91%  { transform: scaleX(1.02) scaleY(0.99) rotate(0.5deg); }
            100% { transform: scaleX(1)    scaleY(1)    rotate(0deg); }
        }

        @keyframes flame-inner-flicker {
            0%   { transform: scaleX(1)    scaleY(1); }
            14%  { transform: scaleX(1.15) scaleY(0.87); }
            28%  { transform: scaleX(0.85) scaleY(1.15); }
            43%  { transform: scaleX(1.12) scaleY(0.90); }
            57%  { transform: scaleX(0.88) scaleY(1.12); }
            71%  { transform: scaleX(1.07) scaleY(0.94); }
            85%  { transform: scaleX(0.94) scaleY(1.06); }
            100% { transform: scaleX(1)    scaleY(1); }
        }


        @keyframes ember-rise-1 {
            0%   { transform: translate(0, 0);        opacity: 0; }
            2%   { opacity: 0.9; }
            30%  { transform: translate(-3px, -20px); opacity: 0; }
            100% { transform: translate(-3px, -20px); opacity: 0; }
        }

        @keyframes ember-rise-2 {
            0%   { transform: translate(0, 0);       opacity: 0; }
            3%   { opacity: 0.8; }
            28%  { transform: translate(4px, -16px); opacity: 0; }
            100% { transform: translate(4px, -16px); opacity: 0; }
        }

        @keyframes ember-rise-3 {
            0%   { transform: translate(0, 0);       opacity: 0; }
            2%   { opacity: 0.85; }
            32%  { transform: translate(1px, -22px); opacity: 0; }
            100% { transform: translate(1px, -22px); opacity: 0; }
        }

        .streak-flame {
            display: block;
            flex-shrink: 0;
        }

        .flame-body {
            transform-box: fill-box;
            transform-origin: bottom center;
            animation: flame-flicker 1.3s ease-in-out infinite;
        }

        .flame-inner {
            transform-box: fill-box;
            transform-origin: bottom center;
            animation: flame-inner-flicker 0.65s ease-in-out infinite;
        }


        .ember-1 { animation: ember-rise-1 3.2s ease-out infinite; animation-delay: 0.4s; }
        .ember-2 { animation: ember-rise-2 2.8s ease-out infinite; animation-delay: 1.5s; }
        .ember-3 { animation: ember-rise-3 3.8s ease-out infinite; animation-delay: 0.9s; }

        .streak-label {
            color: rgba(255, 200, 120, 0.95);
            font-weight: 600;
        }

        .streak-ashes {
            display: block;
            flex-shrink: 0;
            opacity: 0.45;
        }

        .streak-label-low {
            color: rgba(240, 240, 250, 0.95);
            font-weight: 600;
        }

        .streak-label-wrap {
            position: relative;
            display: inline-block;
        }

        [data-tooltip] {
            cursor: default;
        }

        [data-tooltip]::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: calc(100% + 7px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(14, 14, 26, 0.97);
            color: rgba(190, 205, 218, 0.88);
            font-size: 0.63rem;
            font-weight: 400;
            padding: 0.35rem 0.6rem;
            border-radius: 3px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 10;
            box-shadow: 1px 2px 6px rgba(0, 0, 0, 0.5);
        }

        [data-tooltip]:hover::after {
            opacity: 1;
        }

        .text-ember {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            pointer-events: none;
            bottom: 100%;
        }

        .te-1 { left: 15%; background: #ff9800; animation: ember-rise-1 3.5s ease-out infinite; animation-delay: 0.2s; }
        .te-2 { left: 55%; background: #ffcc02; animation: ember-rise-2 3.0s ease-out infinite; animation-delay: 1.2s; }
        .te-3 { left: 80%; background: #ff6d00; animation: ember-rise-3 4.0s ease-out infinite; animation-delay: 0.7s; }

        .streak-progress {
            font-size: 0.7rem;
            color: rgba(190, 205, 218, 0.4);
            margin-top: 0.1rem;
        }

        .streak-progress.goal-met {
            color: rgba(130, 210, 140, 0.85);
        }

        .bonus-info {
            font-size: 0.7rem;
            margin-top: 0.1rem;
            display: flex;
            align-items: center;
            min-height: 14px;
        }

        .bonus-label-wrap {
            position: relative;
            display: inline-block;
        }

        .bonus-label {
            color: rgba(255, 210, 60, 0.95);
            font-weight: 600;
        }

        @keyframes bonus-shimmer {
            0%, 100% { color: rgba(255, 210, 60, 0.95);  text-shadow: 0 0 6px rgba(255, 180, 0, 0.4); }
            50%       { color: rgba(255, 240, 140, 1);    text-shadow: 0 0 12px rgba(255, 210, 0, 0.9), 0 0 22px rgba(255, 150, 0, 0.5); }
        }

        .bonus-label-elite {
            animation: bonus-shimmer 2s ease-in-out infinite;
        }

        .bonus-ember {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            pointer-events: none;
            bottom: 100%;
        }

        .be-1 { left: 10%; background: #ffcc02; animation: ember-rise-1 3.8s ease-out infinite; animation-delay: 0.6s; }
        .be-2 { left: 50%; background: #ff9800; animation: ember-rise-2 3.2s ease-out infinite; animation-delay: 1.8s; }
        .be-3 { left: 85%; background: #ffd600; animation: ember-rise-3 4.2s ease-out infinite; animation-delay: 1.1s; }

        @media (max-width: 900px) {
            #simpleGrid, .mode-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            #simpleGrid, .mode-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .mode-section {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .mode-label {
                width: 100%;
            }

            .launch-btn {
                width: auto;
                flex: 1;
                min-width: 100px;
                text-align: center;
            }

            .level-btn {
                width: 100%;
            }

            #levelGrid {
                flex-direction: column;
            }
        }

        /* ===== 2.4 visual refresh ===== */

        body {
            background-image:
                radial-gradient(ellipse 70% 50% at 15% 0%, rgba(60, 100, 170, 0.22), transparent 60%),
                radial-gradient(ellipse 60% 45% at 100% 100%, rgba(124, 108, 240, 0.10), transparent 60%),
                linear-gradient(rgba(190, 205, 218, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(190, 205, 218, 0.035) 1px, transparent 1px);
            background-size: auto, auto, 28px 28px, 28px 28px;
            background-attachment: fixed;
        }

        .title {
            letter-spacing: 0.02em;
            text-shadow: 0 0 24px rgba(90, 130, 200, 0.35);
        }

        .title::after {
            content: '';
            display: block;
            width: 72px;
            height: 3px;
            margin: 0.6rem auto 0;
            border-radius: 2px;
            background: linear-gradient(90deg, #4fc3f7, #7c6cf0);
            opacity: 0.85;
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            color: rgba(190, 205, 218, 0.55);
        }

        .section-label::before {
            content: '';
            width: 3px;
            height: 12px;
            border-radius: 2px;
            background: linear-gradient(180deg, #4fc3f7, #7c6cf0);
        }

        .mode-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(190, 205, 218, 0.09);
            border-radius: 10px;
            padding: 0.9rem 0.95rem;
        }

        #simpleGrid, .mode-grid {
            gap: 1.25rem;
        }

        .launch-btn, .level-btn, .group-btn, .start-btn {
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .launch-btn, .level-btn, .group-btn {
            transition: background-color 0.2s, box-shadow 0.2s, transform 0.15s;
        }

        .launch-btn:hover, .level-btn:hover, .group-btn:hover {
            transform: translateY(-1px);
        }

        .level-btn {

            const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
            return match ? decodeURIComponent(match[1]) : null;
        }

        function setCookie(name, value) {
            const expires = new Date();
            expires.setFullYear(expires.getFullYear() + 1);
            document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + expires.toUTCString() + '; path=/';

                    const tokens = marked.lexer(md);

                    const lastStr = getCookie('streakLastDate_' + modeKey);
                    const alive = lastStr === todayStr || lastStr === toDateStr(prevWeekday(today));

<g class="flame-body">

        function buildCheckPanel(section, gridEl, panelEl) {
            panelEl.innerHTML = '';

            const backBtn = document.createElement('button');
            backBtn.className = 'panel-back-btn';
            backBtn.textContent = '\u2190 Back';
            backBtn.addEventListener('click', () => closeGroupPanel(gridEl, panelEl));
            panelEl.appendChild(backBtn);

            const title = document.createElement('p');
            title.className = 'check-panel-title';
            title.textContent = section.label;
            panelEl.appendChild(title);

            if (section.radio) {
                // Required single-choice (radio buttons) — no base, all options exclusive
                const sublabel = document.createElement('p');
                sublabel.className = 'panel-sublabel';
                sublabel.textContent = 'Choose one';
                panelEl.appendChild(sublabel);

                const radios = [];
                section.options.forEach((opt) => {
                    const label = document.createElement('label');
                    label.className = 'check-item' + (opt.href ? '' : ' disabled');

                    const rb = document.createElement('input');
                    rb.type = 'radio';
                    rb.name = 'panelRadio';
                    if (!opt.href) rb.disabled = true;

                    const span = document.createElement('span');
                    span.textContent = opt.text;

                    label.appendChild(rb);
                    label.appendChild(span);
                    panelEl.appendChild(label);

                    if (opt.href) radios.push({ rb, href: opt.href });
                });

                const startBtn = document.createElement('button');
                startBtn.className = 'start-btn';
                startBtn.textContent = 'Start';
                startBtn.disabled = true;

                radios.forEach(({ rb }) => {
                    rb.addEventListener('change', () => {
                        startBtn.disabled = !radios.some(r => r.rb.checked);
                    });
                });

                startBtn.addEventListener('click', () => {
                    const selected = radios.find(r => r.rb.checked);
                    if (selected) launchMode(selected.href);
                });

                panelEl.appendChild(startBtn);
            } else {
                // Optional modifiers (checkboxes) — first option is always-included base
                const baseOpt = section.options[0];
                const modifierOpts = section.options.slice(1);

                if (modifierOpts.some(o => o.href)) {
                    const sublabel = document.createElement('p');
                    sublabel.className = 'panel-sublabel';
                    sublabel.textContent = 'Modifiers (optional)';
                    panelEl.appendChild(sublabel);
                }

                const checkboxes = [];
                modifierOpts.forEach((opt) => {
                    const label = document.createElement('label');
                    label.className = 'check-item' + (opt.href ? '' : ' disabled');

                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    if (!opt.href) cb.disabled = true;

                    const span = document.createElement('span');
                    span.textContent = opt.text;

                    label.appendChild(cb);
                    label.appendChild(span);
                    panelEl.appendChild(label);

                    if (opt.href) checkboxes.push({ cb, href: opt.href });
                });

                const startBtn = document.createElement('button');
                startBtn.className = 'start-btn';
                startBtn.textContent = 'Start';

                startBtn.addEventListener('click', () => {
                    const base = baseOpt && baseOpt.href ? [baseOpt.href] : [];
                    const selected = checkboxes.filter(c => c.cb.checked).map(c => c.href);
                    launchMode(combineHrefs([...base, ...selected]));

                panelEl.appendChild(startBtn);

            panelEl.style.opacity = '0';
            panelEl.style.transform = 'translateY(6px)';
            panelEl.style.display = 'flex';

            panelEl.style.transition = 'opacity 0.15s ease, transform 0.15s ease';
            panelEl.style.opacity = '1';
            panelEl.style.transform = 'translateY(0)';
            setTimeout(() => { panelEl.style.transition = ''; }, 150);

        function combineHrefs(hrefs) {
            if (hrefs.length === 1) return hrefs[0];
            try {
                const parsed = hrefs.map(h => new URL(h, window.location.href));
                const firstPath = parsed[0].pathname;
                if (!parsed.every(u => u.pathname === firstPath)) return hrefs[0];
                // Combine 'exercise' params (fractions/choice pages)
                if (parsed.every(u => u.searchParams.has('exercise'))) {
                    const exercises = parsed.map(u => u.searchParams.get('exercise')).join(',');
                    const base = new URL(hrefs[0], window.location.href);
                    base.searchParams.set('exercise', exercises);
                    return base.pathname + base.search;
                }
                // Combine 'digits' params (practice page)
                if (parsed.every(u => u.searchParams.has('digits'))) {
                    const digits = parsed.map(u => u.searchParams.get('digits')).join(',');
                    const base = new URL(hrefs[0], window.location.href);
                    base.searchParams.set('digits', digits);
                    return base.pathname + base.search;
                }
            } catch(e) {}
            return hrefs[0];
        }

        // ===== Simple-operation menu =====
        // Clicking a digit button spotlights that operation's card and opens a
        // menu beside it with optional negatives / decimals and "mix with regular".
        // The digit comes from the button that was tapped; option choices are
        // remembered per operation.

        const OP_NAMES = { multiply: 'Multiplication', add: 'Addition', subtract: 'Subtraction', divide: 'Division' };
        let opMenuState = null;   // { card, mode, digits: Set, negatives, decimals, mixRegular }

        function opMenuEls() {
            let backdrop = document.getElementById('opBackdrop');
            let menu     = document.getElementById('opMenu');
            if (!backdrop) {
                backdrop = document.createElement('div');
                backdrop.id = 'opBackdrop';
                backdrop.addEventListener('click', closeOpMenu);
                document.body.appendChild(backdrop);

                menu = document.createElement('div');
                menu.id = 'opMenu';
                document.body.appendChild(menu);

                document.addEventListener('keydown', e => { if (e.key === 'Escape' && opMenuState) closeOpMenu(); });
                window.addEventListener('resize', positionOpMenu);
                window.addEventListener('scroll', positionOpMenu, { passive: true });
            }
            return { backdrop, menu };
        }

        function loadOpOptions(mode) {
            try { return JSON.parse(localStorage.getItem('simpleOpts_' + mode) || 'null') || {}; }
            catch (e) { return {}; }
        }

        function opHref(s) {
            const digits = [1, 2, 3].filter(d => s.digits.has(d)).join(',');
            let href = 'practice.html?mode=' + s.mode + '&digits=' + digits;
            if (s.negatives) href += '&negatives=1';
            if (s.decimals)  href += '&decimals=1';
            if (s.mixRegular && (s.negatives || s.decimals)) href += '&mixregular=1';
            return href;
        }

        function openOpMenu(card, mode, digit) {
            const { backdrop, menu } = opMenuEls();
            const saved = loadOpOptions(mode);
            opMenuState = {
                card, mode,
                digits: new Set([digit]),
                negatives:  !!saved.negatives,
                decimals:   !!saved.decimals,
                mixRegular: !!saved.mixRegular,
            };
            renderOpMenu();
            document.querySelectorAll('.mode-section.op-focus').forEach(el => el.classList.remove('op-focus'));
            card.classList.add('op-focus');
            backdrop.classList.add('show');
            menu.classList.add('show');
            positionOpMenu();
            menu.offsetHeight;
            menu.classList.add('visible');
        }

        function closeOpMenu() {
            if (!opMenuState) return;
            const { backdrop, menu } = opMenuEls();
            opMenuState.card.classList.remove('op-focus');
            backdrop.classList.remove('show');
            menu.classList.remove('visible');
            menu.classList.remove('show');
            opMenuState = null;
        }

        // Beside the card on the right if there's room, else on the left,
        // else directly below it — always kept inside the viewport.
        function positionOpMenu() {
            if (!opMenuState) return;
            const menu = document.getElementById('opMenu');
            const r  = opMenuState.card.getBoundingClientRect();
            const mw = menu.offsetWidth, mh = menu.offsetHeight;
            const vw = window.innerWidth, vh = window.innerHeight, gap = 12;
            let left, top;
            if (r.right + gap + mw <= vw - gap) {
                left = r.right + gap;
                top  = r.top;
            } else if (r.left - gap - mw >= gap) {
                left = r.left - gap - mw;
                top  = r.top;
            } else {
                left = Math.max(gap, Math.min(r.left, vw - mw - gap));
                top  = r.bottom + 8;
            }
            top = Math.max(gap, Math.min(top, vh - mh - gap));
            menu.style.left = Math.round(left) + 'px';
            menu.style.top  = Math.round(top) + 'px';
        }

        function renderOpMenu() {
            const menu = document.getElementById('opMenu');
            const s = opMenuState;
            menu.innerHTML = '';

            const head = document.createElement('div');
            head.className = 'op-menu-head';
            head.innerHTML =
                '<span class="op-menu-title">' + OP_NAMES[s.mode] + ' · ' + [...s.digits][0] + '-Digit</span>' +
                '<button type="button" class="op-menu-close" aria-label="Close">&#x2715;</button>';
            head.querySelector('.op-menu-close').addEventListener('click', closeOpMenu);
            menu.appendChild(head);

            const optLabel = document.createElement('p');
            optLabel.className = 'panel-sublabel';
            optLabel.textContent = 'Options';
            menu.appendChild(optLabel);

            const makeCheck = (key, text) => {
                const label = document.createElement('label');
                label.className = 'check-item';
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = !!s[key];
                const span = document.createElement('span');
                span.textContent = text;
                label.appendChild(cb);
                label.appendChild(span);
                return { label, cb };
            };
            const neg = makeCheck('negatives',  'With negatives');
            const dec = makeCheck('decimals',   'With decimals');
            const mix = makeCheck('mixRegular', 'Mix with regular');

            const hint = document.createElement('p');
            hint.className = 'op-hint';
            hint.textContent = 'Shuffles the options above in and out at random — some questions plain, some with one, some with both.';

            const syncMix = () => {
                const any = s.negatives || s.decimals;
                mix.cb.disabled = !any;
                mix.label.classList.toggle('disabled', !any);
            };
            neg.cb.addEventListener('change', () => { s.negatives = neg.cb.checked; syncMix(); });
            dec.cb.addEventListener('change', () => { s.decimals  = dec.cb.checked; syncMix(); });
            mix.cb.addEventListener('change', () => { s.mixRegular = mix.cb.checked; });
            syncMix();

            menu.appendChild(neg.label);
            menu.appendChild(dec.label);
            menu.appendChild(mix.label);
            menu.appendChild(hint);

            const start = document.createElement('button');
            start.type = 'button';
            start.className = 'start-btn';
            start.textContent = 'Start';
            start.addEventListener('click', () => {
                try {
                    localStorage.setItem('simpleOpts_' + s.mode, JSON.stringify({
                        negatives: s.negatives, decimals: s.decimals, mixRegular: s.mixRegular,
                    }));
                } catch (e) {}
                const href = opHref(s);
                closeOpMenu();
                launchMode(href);
            });
            menu.appendChild(start);
        }

        // ===== Mix & Match =====
        // The builder derives its checklist from LEVELS so it can never drift
        // from what the launcher offers. One entry per distinct href; an
        // exercise that appears in several levels is listed under the first.

        const MIX_SELECTION_KEY = 'mixSelection';
        const MIX_GROUP_COLORS  = { simple: '#8ab4ff', 1: '#4fc3f7', 2: '#81c784', 3: '#ffb74d', 4: '#f06292', 5: '#ce93d8' };
        let mixCatalog  = null;
        let mixSelected = new Set();

        function buildMixCatalog() {
            const seen   = new Set();
            const groups = [];
            ['simple'].forEach(key => {
                const level = LEVELS[key];
                const group = { key: String(key), label: level.label, items: [] };
                const add = (section, parts, href) => {
                    if (!href || seen.has(href)) return;
                    seen.add(href);
                    group.items.push({ href, section, label: parts.join(' · ') });
                };
                level.sections.forEach(sec => {
                    if (sec.type === 'operation-group') {
                        sec.operations.forEach(op =>
                            op.options.forEach(o => add(sec.label, [sec.label, op.text, o.text], o.href)));
                    } else if (sec.type === 'conversion') {
                        sec.conversionTypes.forEach(ct => add(sec.label, [sec.label, ct.text], ct.href));
                    } else {
                        sec.options.forEach(o => add(sec.label, [sec.label, o.text], o.href));
                    }
                });
                if (group.items.length) groups.push(group);
            });
            return groups;
        }

        function getMixCatalog() {
            return mixCatalog || (mixCatalog = buildMixCatalog());
        }

        function mixAllItems() {
            return getMixCatalog().flatMap(g => g.items);
        }

        function loadMixSelection() {
            const valid = new Set(mixAllItems().map(i => i.href));
            try {
                const saved = JSON.parse(localStorage.getItem(MIX_SELECTION_KEY) || '[]');
                return new Set(saved.filter(h => valid.has(h)));
            } catch (e) {
                return new Set();
            }
        }

        function saveMixSelection() {
            try { localStorage.setItem(MIX_SELECTION_KEY, JSON.stringify([...mixSelected])); } catch (e) {}
        }

        function mixPlaylist() {
            return mixAllItems()
                .filter(i => mixSelected.has(i.href))
                .map(i => ({ label: i.label, href: i.href }));
        }

        function startMix() {
            const items = mixPlaylist();
            if (items.length < 2) return;
            sessionStorage.setItem('mixPlaylist', JSON.stringify(items));
            sessionStorage.removeItem('mixScore');
            launchMode('mix.html');
        }

        function updateMixReplay() {
            const btn = document.getElementById('mixReplayBtn');
            const n = mixPlaylist().length;
            if (n >= 2) {
                btn.textContent = 'Replay last mix · ' + n + ' operations';
                btn.style.display = '';
            } else {
                btn.style.display = 'none';
            }
        }

        function refreshMixCounts() {
            const total = mixSelected.size;
            document.getElementById('mixCount').innerHTML = '<strong>' + total + '</strong> selected';
            document.getElementById('mixStartBtn').disabled = total < 2;
            document.querySelectorAll('.mix-group').forEach(groupEl => {
                const hrefs = JSON.parse(groupEl.dataset.hrefs);
                const n = hrefs.filter(h => mixSelected.has(h)).length;
                const badge = groupEl.querySelector('.mix-badge');
                badge.textContent = n + ' / ' + hrefs.length;
                badge.classList.toggle('has', n > 0);
            });
        }

        function buildMixView() {
            const container = document.getElementById('mixGroups');
            container.innerHTML = '';

            getMixCatalog().forEach(group => {
                const hasPicks = group.items.some(i => mixSelected.has(i.href));
                const groupEl = document.createElement('div');
                groupEl.className = 'mix-group open';
                groupEl.dataset.hrefs = JSON.stringify(group.items.map(i => i.href));

                const head = document.createElement('div');
                head.className = 'mix-group-head';
                head.innerHTML =
                    '<span class="mix-chevron"></span>' +
                    '<span class="mix-level-dot" style="background:' + MIX_GROUP_COLORS[group.key] + '"></span>' +
                    '<span class="mix-group-title">' + group.label + '</span>' +
                    '<span class="mix-badge"></span>' +
                    '<span class="mix-group-actions">' +
                        '<button type="button" data-act="all">All</button>' +
                        '<button type="button" data-act="none">None</button>' +
                    '</span>';
                head.addEventListener('click', e => {
                    const act = e.target.dataset && e.target.dataset.act;
                    if (act) {
                        group.items.forEach(i => act === 'all' ? mixSelected.add(i.href) : mixSelected.delete(i.href));
                        groupEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                            cb.checked = mixSelected.has(cb.dataset.href);
                        });
                        saveMixSelection();
                        refreshMixCounts();
                        if (act === 'all') groupEl.classList.add('open');
                        return;
                    }
                    groupEl.classList.toggle('open');
                });
                groupEl.appendChild(head);

                const body = document.createElement('div');
                body.className = 'mix-group-body';
                [...new Set(group.items.map(i => i.section))].forEach(secLabel => {
                    const sec = document.createElement('div');
                    sec.className = 'mix-sec';
                    const lbl = document.createElement('div');
                    lbl.className = 'mix-sec-label';
                    lbl.textContent = secLabel;
                    sec.appendChild(lbl);

                    group.items.filter(i => i.section === secLabel).forEach(item => {
                        const label = document.createElement('label');
                        label.className = 'check-item';
                        const cb = document.createElement('input');
                        cb.type = 'checkbox';
                        cb.dataset.href = item.href;
                        cb.checked = mixSelected.has(item.href);
                        cb.addEventListener('change', () => {
                            if (cb.checked) mixSelected.add(item.href); else mixSelected.delete(item.href);
                            saveMixSelection();
                            refreshMixCounts();
                        });
                        const span = document.createElement('span');
                        // The section is already the column heading — don't repeat it
                        const prefix = secLabel + ' · ';
                        span.textContent = item.label.startsWith(prefix) ? item.label.slice(prefix.length) : item.label;
                        label.appendChild(cb);
                        label.appendChild(span);
                        sec.appendChild(label);
                    });
                    body.appendChild(sec);
                });
                groupEl.appendChild(body);
                container.appendChild(groupEl);
            });

            refreshMixCounts();
        }

        function initMixView() {
            const mainView = document.getElementById('mainView');
            const mixView  = document.getElementById('mixView');

            document.getElementById('mixOpenBtn').addEventListener('click', () => {
                mixSelected = loadMixSelection();
                buildMixView();
                fadeSwap(mainView, mixView, 'flex');
            });
            document.getElementById('mixBackBtn').addEventListener('click', () => {
                updateMixReplay();
                fadeSwap(mixView, mainView, 'flex');
            });
            document.getElementById('mixClearBtn').addEventListener('click', () => {
                mixSelected.clear();
                saveMixSelection();
                document.querySelectorAll('#mixGroups input[type="checkbox"]').forEach(cb => { cb.checked = false; });
                refreshMixCounts();
            });
            document.getElementById('mixStartBtn').addEventListener('click', startMix);
            document.getElementById('mixReplayBtn').addEventListener('click', () => {
                mixSelected = loadMixSelection();
                startMix();
            });

            mixSelected = loadMixSelection();
            updateMixReplay();
        }

        document.addEventListener('DOMContentLoaded', () => {
            buildSimpleGrid(document.getElementById('simpleGrid'), 'simple');
            initMixView();

            document.querySelectorAll('.level-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const levelKey = btn.dataset.level;
                    document.getElementById('subtitle').textContent = LEVELS[levelKey].label;
                    buildGrid(document.getElementById('subGrid'), levelKey, document.getElementById('subCheckPanel'));
                    fadeSwap(document.getElementById('mainView'), document.getElementById('subOptions'), 'flex');
                });
            });

            document.getElementById('backBtn').addEventListener('click', () => {
                fadeSwap(document.getElementById('subOptions'), document.getElementById('mainView'), 'flex');
            });

            // Ctrl+Shift+X — clear all cookies (testing)
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.shiftKey && e.key === 'X') {
                    document.cookie.split(';').forEach(cookie => {
                        const name = cookie.split('=')[0].trim();
                        document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/';
                    });
                    location.reload();
                }
            });
        });
    </script>
</body>
</html>
