<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="newicon.png" type="image/x-icon">
    <script src="version.js"></script>
    <title>Math Practice</title>
    <style>
        body { padding: 16px; }

        .prev-area {
            min-height: 2rem;
            font-size: 1rem;
            color: rgba(190, 205, 218, 0.35);
            margin-top: 0.5rem;
        }
        .prev-area.correct-result { color: rgba(100, 190, 100, 0.65); }
        .prev-area.wrong-result   { color: rgba(210, 80,  80,  0.65); }

        .equation-area {
            margin: 2rem 0 1.5rem;
        }

        .equation-label {
            font-size: 0.9rem;
            color: rgba(190, 205, 218, 0.4);
            margin-bottom: 0.75rem;
        }

        .equation-display {
            font-size: 1.8rem;
            font-weight: 600;
            color: rgba(220, 230, 245, 0.95);
            line-height: 1.4;
        }

        .equation-display sup {
            font-size: 1rem;
            vertical-align: super;
            line-height: 0;
        }
    </style>
</head>
<body class="darkTheme">
    <div style="z-index: 1;">
        <div class="header">
            <div>
                <span class="title1">Math Practice</span>
                <div id="modeIndicator" class="modeIndicator"></div>
            </div>
            <div class="scoreDisplay">
                <div>
                    <span class="questionsCorrect" id="questionscorrect">0</span>
                    <span class="questionsCorrect">/</span>
                    <span class="questionsCorrect" id="questionsAnswered">0</span>
                    <span class="questionsCorrect"> correct</span>
                </div>
            </div>
        </div>

        <div id="prevArea" class="prev-area"></div>

        <div class="equation-area">
            <div class="equation-label">Solve using order of operations</div>
            <div id="equationDisplay" class="equation-display"></div>
        </div>

        <div class="displayedAnswerHolder">
            <div id="displayedSelectedAnswer" class="displayedAnswer"><span class="cursor"></span></div>
        </div>

        <br>

        <div class="numberbuttons">
            <button id="button1" class="numButtons">1</button>
            <button id="button2" class="numButtons">2</button>
            <button id="button3" class="numButtons">3</button>
            <button id="checkmark" class="checkButton">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;display:block;">
                    <path d="M 4 13 C 6 15 7 17 9 19 C 11 14 14 9 19 4"/>
                </svg>
            </button>
            <button id="button4" class="numButtons">4</button>
            <button id="button5" class="numButtons">5</button>
            <button id="button6" class="numButtons">6</button>
            <button id="button7" class="numButtons">7</button>
            <button id="button8" class="numButtons">8</button>
            <button id="button9" class="numButtons">9</button>
            <button id="negativeButton" class="numButtons">±</button>
            <button id="button0" class="numButtons">0</button>
            <button id="deleteButton" class="numButtons deleteButton">⌫</button>
        </div>

        <br><br>
        <div class="modeButtonRow">
            <button id="finishButton" class="finishButton">Finish</button>
        </div>

        <div class="textOnTheRight"></div>
    </div>

    <script>
        // --- State ---
        let selectedAnswer    = '';
        let currentAnswer     = 0;
        let currentExprHTML   = '';
        let questionsCorrect  = 0;
        let questionsAnswered = 0;
        let enterCooldown     = false;

        // --- Helpers ---
        function ri(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        const particleColors = ['#4fc3f7','#81c784','#ffb74d','#f06292','#ce93d8','#fff176'];
        function spawnParticles(el) {
            const rect = el.getBoundingClientRect();
            const ox = rect.left + rect.width / 2;
            const oy = rect.top  + rect.height / 2;
            for (let i = 0; i < 28; i++) {
                const p     = document.createElement('div');
                p.className = 'particle';
                const angle = Math.random() * 2 * Math.PI;
                const dist  = 80 + Math.random() * 140;
                const size  = (6 + Math.random() * 8) + 'px';
                p.style.cssText = `left:${ox}px;top:${oy}px;width:${size};height:${size};background-color:${particleColors[ri(0, particleColors.length - 1)]};`;
                p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
                document.body.appendChild(p);
                p.addEventListener('animationend', () => p.remove());
            }
        }

        // --- Expression templates ---
        // Each returns { html, ans } or null (if result would be trivial/out of range).
        // × and − are typographic characters. <sup> used for exponents.
        const TEMPLATES = [
            // (a + b) × c
            () => {
                const a=ri(2,9), b=ri(2,9), c=ri(2,9);
                return { html:`(${a} + ${b}) × ${c}`, ans:(a+b)*c };
            },
            // (a − b) × c
            () => {
                const b=ri(1,8), a=ri(b+1,12), c=ri(2,9);
                return { html:`(${a} − ${b}) × ${c}`, ans:(a-b)*c };
            },
            // a × b + c × d
            () => {
                const a=ri(2,9), b=ri(2,9), c=ri(2,9), d=ri(2,9);
                return { html:`${a} × ${b} + ${c} × ${d}`, ans:a*b+c*d };
            },
            // a × b − c × d  (positive result guaranteed)
            () => {
                let a, b, c, d;
                let tries = 0;
                do { a=ri(2,9); b=ri(2,9); c=ri(2,9); d=ri(2,9); tries++; } while (a*b <= c*d && tries < 20);
                if (a*b <= c*d) return null;
                return { html:`${a} × ${b} − ${c} × ${d}`, ans:a*b-c*d };
            },
            // a + b × c − d
            () => {
                const a=ri(1,12), b=ri(2,9), c=ri(2,9), d=ri(1,15);
                return { html:`${a} + ${b} × ${c} − ${d}`, ans:a+b*c-d };
            },
            // (a + b) × (c + d)
            () => {
                const a=ri(1,8), b=ri(1,8), c=ri(1,8), d=ri(1,8);
                return { html:`(${a} + ${b}) × (${c} + ${d})`, ans:(a+b)*(c+d) };
            },
            // (a − b) × (c + d)
            () => {
                const b=ri(1,7), a=ri(b+1,12), c=ri(1,8), d=ri(1,8);
                return { html:`(${a} − ${b}) × (${c} + ${d})`, ans:(a-b)*(c+d) };
            },
            // a² + b × c
            () => {
                const a=ri(2,9), b=ri(2,9), c=ri(2,9);
                return { html:`${a}<sup>2</sup> + ${b} × ${c}`, ans:a*a+b*c };
            },
            // a × b² − c
            () => {
                const a=ri(2,6), b=ri(2,7), c=ri(1,20);
                return { html:`${a} × (${b}<sup>2</sup>) − ${c}`, ans:a*b*b-c };
            },
            // (a + b)² − c × d
            () => {
                const a=ri(1,6), b=ri(1,6), c=ri(1,9), d=ri(1,9);
                return { html:`(${a} + ${b})<sup>2</sup> − ${c} × ${d}`, ans:(a+b)*(a+b)-c*d };
            },
            // a² − b × c
            () => {
                const a=ri(3,12), b=ri(1,9), c=ri(1,9);
                const ans = a*a - b*c;
                if (ans <= 0) return null;
                return { html:`${a}<sup>2</sup> − ${b} × ${c}`, ans };
            },
            // a × (b + c) − d × e
            () => {
                const a=ri(2,8), b=ri(1,8), c=ri(1,8), d=ri(2,8), e=ri(2,8);
                return { html:`${a} × (${b} + ${c}) − ${d} × ${e}`, ans:a*(b+c)-d*e };
            },
            // a × (b − c) + d
            () => {
                const c=ri(1,7), b=ri(c+1,10), a=ri(2,9), d=ri(1,12);
                return { html:`${a} × (${b} − ${c}) + ${d}`, ans:a*(b-c)+d };
            },
            // a + b × (c − d)
            () => {
                const d=ri(1,7), c=ri(d+1,12), a=ri(1,20), b=ri(2,9);
                return { html:`${a} + ${b} × (${c} − ${d})`, ans:a+b*(c-d) };
            },
            // a × b + c − d × e
            () => {
                const a=ri(2,9), b=ri(2,9), c=ri(1,20), d=ri(2,9), e=ri(2,9);
                return { html:`${a} × ${b} + ${c} − ${d} × ${e}`, ans:a*b+c-d*e };
            },
            // (a + b)² + c
            () => {
                const a=ri(1,5), b=ri(1,5), c=ri(1,20);
                return { html:`(${a} + ${b})<sup>2</sup> + ${c}`, ans:(a+b)*(a+b)+c };
            },
            // a × b² + c × d
            () => {
                const a=ri(1,5), b=ri(2,6), c=ri(2,9), d=ri(2,9);
                return { html:`${a} × (${b}<sup>2</sup>) + ${c} × ${d}`, ans:a*b*b+c*d };
            },
        ];

        function generateQuestion() {
            let result = null;
            let tries = 0;
            while (tries < 50) {
                tries++;
                const tpl = TEMPLATES[ri(0, TEMPLATES.length - 1)];
                const q = tpl();
                if (q && q.ans >= -99 && q.ans <= 999) { result = q; break; }
            }
            return result || { html: '(3 + 4) × 5', ans: 35 };
        }

        function loadQuestion() {
            const q = generateQuestion();
            currentAnswer  = q.ans;
            currentExprHTML = q.html;
            document.getElementById('equationDisplay').innerHTML = q.html + ' =';
            selectedAnswer = '';
            renderAnswer();
        }

        // --- Answer display ---
        function renderAnswer() {
            document.getElementById('displayedSelectedAnswer').innerHTML =
                selectedAnswer + '<span class="cursor"></span>';
        }

        function appendDigit(d) {
            if (selectedAnswer === '0') selectedAnswer = '';
            if (selectedAnswer === '-') { if (d === '0') return; }
            if (selectedAnswer.replace('-', '').length >= 3) return;
            selectedAnswer += d;
            renderAnswer();
        }

        // --- Check ---
        document.getElementById('checkmark').addEventListener('click', () => {
            const checkBtn  = document.getElementById('checkmark');
            const checkPath = checkBtn.querySelector('svg path');
            const len = checkPath.getTotalLength();
            checkPath.animate([
                { offset: 0,    strokeDasharray: `${len} ${len}`, opacity: 1,   easing: 'ease-in'  },
                { offset: 0.38, strokeDasharray: `0.5 ${len}`,    opacity: 0.2, easing: 'linear'   },
                { offset: 0.44, strokeDasharray: `${len} ${len}`, opacity: 0,   easing: 'ease-out' },
                { offset: 1.0,  strokeDasharray: `${len} ${len}`, opacity: 1 },
            ], { duration: 325 });

            const wasCorrect = parseInt(selectedAnswer) === currentAnswer;

            if (wasCorrect) {
                setTimeout(() => spawnParticles(checkBtn), 325);
                questionsCorrect++;
            }
            questionsAnswered++;

            document.getElementById('questionscorrect').textContent = questionsCorrect;
            document.getElementById('questionsAnswered').textContent = questionsAnswered;

            showPrev(currentExprHTML + ' = ' + currentAnswer, wasCorrect);
            loadQuestion();
        });

        function showPrev(summaryHTML, wasCorrect) {
            const el = document.getElementById('prevArea');
            el.innerHTML = summaryHTML + (wasCorrect ? '  ✓' : '  ✗');
            el.className = 'prev-area ' + (wasCorrect ? 'correct-result' : 'wrong-result');
        }

        // --- Buttons ---
        ['1','2','3','4','5','6','7','8','9','0'].forEach(d => {
            document.getElementById('button' + d).addEventListener('click', () => appendDigit(d));
        });

        document.getElementById('negativeButton').addEventListener('click', () => {
            if (selectedAnswer.startsWith('-')) {
                selectedAnswer = selectedAnswer.slice(1);
            } else if (selectedAnswer.length > 0) {
                selectedAnswer = '-' + selectedAnswer;
            } else {
                selectedAnswer = '-';
            }
            renderAnswer();
        });

        document.getElementById('deleteButton').addEventListener('click', () => {
            selectedAnswer = selectedAnswer.slice(0, -1);
            renderAnswer();
        });

        // --- Keyboard ---
        document.addEventListener('keyup', e => {
            if (e.key >= '0' && e.key <= '9') {
                appendDigit(e.key);
            } else if (e.key === '-') {
                document.getElementById('negativeButton').click();
            } else if (e.key === 'Backspace' || e.key === 'Delete') {
                selectedAnswer = selectedAnswer.slice(0, -1);
                renderAnswer();
            } else if (e.key === 'Enter') {
                if (enterCooldown) return;
                enterCooldown = true;
                setTimeout(() => { enterCooldown = false; }, 400);
                document.getElementById('checkmark').click();
            }
        });

        // --- Finish ---
        document.getElementById('finishButton').addEventListener('click', () => {
            spawnParticles(document.getElementById('finishButton'));
            setTimeout(() => { window.location.href = 'index.html'; }, 1000);
        });

        // --- Init ---
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('modeIndicator').textContent = 'Order of Operations';
            loadQuestion();
        });
    </script>
</body>
</html>
