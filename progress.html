<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="icon" href="newicon.png" type="image/x-icon">
    <script src="theme.js"></script>
    <script src="version.js"></script>
    <script src="dev-test.js"></script>
    <script src="activities.js"></script>
    <script src="points.js"></script>
    <title>My Progress</title>
    <style>
        * {
            font-family: 'Roboto Mono', monospace;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse 70% 50% at 15% 0%, rgba(var(--primary-rgb), 0.22), transparent 60%),
                radial-gradient(ellipse 60% 45% at 100% 100%, rgba(var(--grad-b-rgb), 0.10), transparent 60%),
                linear-gradient(rgba(var(--text-rgb), 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(var(--text-rgb), 0.035) 1px, transparent 1px);
            background-size: auto, auto, 28px 28px, 28px 28px;
            background-attachment: fixed;
            color: var(--text-body);
            min-height: 100vh;
            padding: 1.2rem 1.2rem 3rem;
        }

        .pg-wrap {
            max-width: 880px;
            margin: 0 auto;
        }

        .pg-back {
            display: inline-block;
            font-size: 0.9rem;
            color: rgba(var(--text-rgb), 0.55);
            text-decoration: none;
            transition: color 0.2s;
        }

        .pg-back:hover { color: rgba(var(--text-hi-rgb), 0.95); }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin: 0.8rem 0 1.2rem;
            color: rgba(var(--text-hi-rgb), 0.97);
            text-shadow: 0 0 22px rgba(var(--accent-rgb), 0.35);
        }

        h1::after {
            content: '';
            display: block;
            width: 72px;
            height: 3px;
            margin-top: 0.6rem;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--grad-a), var(--grad-b));
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(var(--trim-rgb), 0.3);
            border-radius: 10px;
            padding: 1rem 1.1rem;
        }

        /* Top stats */

        .pg-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.8rem;
            margin-bottom: 1.2rem;
        }

        .stat {
            padding: 0.8rem 1rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: rgba(var(--text-hi-rgb), 0.97);
        }

        .stat-value.flame { color: rgba(255, 200, 120, 0.97); }
        .stat-value.gold  { color: rgba(255, 210, 90, 0.98); }

        .stat-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(var(--text-rgb), 0.55);
            margin-top: 0.15rem;
        }

        /* Calendar */

        .cal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            margin-bottom: 0.4rem;
        }

        .cal-head h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: rgba(var(--text-hi-rgb), 0.95);
            text-align: center;
            flex: 1;
        }

        .nav-btn {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: var(--btn);
            color: rgba(var(--text-hi-rgb), 0.9);
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            transition: background-color 0.2s;
        }

        .nav-btn:hover:not(:disabled) { background: var(--btn-hover); }
        .nav-btn:disabled { opacity: 0.3; cursor: default; }

        .month-sum {
            text-align: center;
            font-size: 0.78rem;
            color: rgba(var(--text-rgb), 0.6);
            margin-bottom: 0.9rem;
        }

        .month-sum b { color: rgba(var(--text-hi-rgb), 0.92); font-weight: 600; }

        .dow, .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .dow {
            margin-bottom: 6px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            text-align: center;
            color: rgba(var(--text-rgb), 0.5);
        }

        .day {
            position: relative;
            min-height: 68px;
            padding: 6px 7px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            border-radius: 8px;
            border: 1px solid rgba(var(--text-rgb), 0.1);
            background: rgba(255, 255, 255, 0.025);
            color: rgba(var(--text-rgb), 0.75);
            cursor: pointer;
            text-align: left;
            transition: background-color 0.15s, border-color 0.15s, transform 0.15s;
        }

        .day:hover:not(:disabled) { transform: translateY(-1px); border-color: rgba(var(--accent-rgb), 0.6); }
        .day:disabled { cursor: default; opacity: 0.35; }
        .day:focus-visible { outline: 2px solid var(--accent-hi); outline-offset: 2px; }

        .d-num { font-size: 0.78rem; opacity: 0.8; }

        .d-pts {
            font-size: 1.05rem;
            font-weight: 600;
            color: rgba(var(--text-hi-rgb), 0.95);
        }

        .d-mark {
            position: absolute;
            top: 5px;
            right: 7px;
            font-size: 0.85rem;
        }

        .day.rest { background: rgba(0, 0, 0, 0.18); color: rgba(var(--text-rgb), 0.5); }

        .day.started { background: rgba(var(--accent-rgb), 0.16); border-color: rgba(var(--accent-rgb), 0.35); }
        .day.goal    { background: rgba(76, 175, 106, 0.2);  border-color: rgba(120, 210, 140, 0.5); }
        .day.goal .d-mark { color: rgba(140, 225, 160, 0.98); }
        .day.bonus   { background: rgba(255, 179, 0, 0.18);  border-color: rgba(255, 210, 90, 0.6); }
        .day.bonus .d-mark { color: rgba(255, 215, 100, 0.98); }
        .day.started .d-mark { color: rgba(var(--accent-hi-rgb), 0.95); }

        .day.today { box-shadow: 0 0 0 2px var(--accent-hi); }
        .day.selected { border-color: var(--accent-hi); background-image: linear-gradient(rgba(255,255,255,0.07), rgba(255,255,255,0.07)); }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 1.2rem;
            margin-top: 0.9rem;
            font-size: 0.72rem;
            color: rgba(var(--text-rgb), 0.6);
        }

        .legend span::before { margin-right: 0.35rem; }
        .legend .lg-goal::before    { content: '\2713'; color: rgba(140, 225, 160, 0.98); }
        .legend .lg-bonus::before   { content: '\2605'; color: rgba(255, 215, 100, 0.98); }
        .legend .lg-started::before { content: '\2022'; color: rgba(var(--accent-hi-rgb), 0.95); }
        .legend .lg-today::before   { content: '\25cb'; color: var(--accent-hi); }
        .legend .lg-rest::before    { content: '\25a0'; color: rgba(var(--text-rgb), 0.3); }

        /* Day details */

        .detail { margin-top: 1.2rem; }

        .detail h3 {
            font-size: 1.05rem;
            font-weight: 600;
            color: rgba(var(--text-hi-rgb), 0.97);
        }

        .detail .status {
            margin: 0.25rem 0 0.8rem;
            font-size: 0.82rem;
            color: rgba(var(--text-rgb), 0.7);
        }

        .detail .status.goal  { color: rgba(140, 225, 160, 0.98); }
        .detail .status.bonus { color: rgba(255, 215, 100, 0.98); }

        .facts {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 2rem;
            font-size: 0.82rem;
            margin-bottom: 0.9rem;
        }

        .facts b { color: rgba(var(--text-hi-rgb), 0.95); font-weight: 600; }

        .act {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.15rem 1rem;
            padding: 0.45rem 0;
            border-top: 1px solid rgba(var(--text-rgb), 0.08);
            font-size: 0.82rem;
        }

        .act-name { color: rgba(var(--text-hi-rgb), 0.9); }
        .act-pts  { color: rgba(var(--text-hi-rgb), 0.95); font-weight: 600; text-align: right; }
        .act-sub  { grid-column: 1; font-size: 0.7rem; color: rgba(var(--text-rgb), 0.55); }

        .act-bar {
            grid-column: 1 / -1;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.07);
            overflow: hidden;
        }

        .act-bar i {
            display: block;
            height: 100%;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--grad-a), var(--grad-b));
        }

        .empty { font-size: 0.85rem; color: rgba(var(--text-rgb), 0.6); }

        /* Backup */

        .backup { margin-top: 1.2rem; }

        .backup h3 {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 400;
            color: rgba(var(--text-rgb), 0.55);
            margin-bottom: 0.4rem;
        }

        .backup p {
            font-size: 0.78rem;
            color: rgba(var(--text-rgb), 0.6);
            margin-bottom: 0.7rem;
            line-height: 1.45;
        }

        .backup-row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }

        .pg-btn {
            padding: 9px 16px;
            font-size: 0.85rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: var(--btn);
            color: rgba(var(--text-hi-rgb), 0.92);
            cursor: pointer;
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            transition: background-color 0.2s;
        }

        .pg-btn:hover { background: var(--btn-hover); }

        #backupMsg { font-size: 0.78rem; color: rgba(var(--text-rgb), 0.75); }
        #backupMsg.bad { color: rgba(255, 140, 140, 0.95); }
        #backupMsg.ok  { color: rgba(140, 225, 160, 0.98); }

        @media (max-width: 640px) {
            body { padding: 0.9rem 0.8rem 2.5rem; }
            h1 { font-size: 1.5rem; }
            .pg-stats { grid-template-columns: repeat(2, 1fr); }
            .dow, .grid { gap: 4px; }
            .day { min-height: 54px; padding: 4px 5px; }
            .d-pts { font-size: 0.88rem; }
            .d-mark { font-size: 0.72rem; right: 4px; top: 3px; }
        }
    </style>
</head>
<body>
    <div class="pg-wrap">
        <a class="pg-back" href="index.html">&larr; Back</a>
        <h1>My progress</h1>

        <div class="pg-stats" id="stats"></div>

        <section class="card" aria-label="Monthly calendar">
            <div class="cal-head">
                <button class="nav-btn" id="prevBtn" aria-label="Previous month">&#x2039;</button>
                <h2 id="monthTitle"></h2>
                <button class="nav-btn" id="nextBtn" aria-label="Next month">&#x203a;</button>
            </div>
            <div class="month-sum" id="monthSum"></div>
            <div class="dow" aria-hidden="true">
                <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
            </div>
            <div class="grid" id="grid"></div>
            <div class="legend">
                <span class="lg-goal">Goal reached</span>
                <span class="lg-bonus">Bonus</span>
                <span class="lg-started">Started</span>
                <span class="lg-today">Today</span>
                <span class="lg-rest">Weekend (optional)</span>
            </div>
        </section>

        <section class="card detail" id="detail" aria-live="polite"></section>

        <section class="card backup">
            <h3>Back up your progress</h3>
            <p>Your progress is stored in this browser only. Save a copy to keep it safe, or load a saved copy on another device.</p>
            <div class="backup-row">
                <button class="pg-btn" id="exportBtn">Save a copy</button>
                <button class="pg-btn" id="importBtn">Load a copy</button>
                <input type="file" id="importFile" accept="application/json,.json" hidden>
                <span id="backupMsg" role="status"></span>
            </div>
        </section>
    </div>
    <script src="progress.js"></script>
</body>
</html>
