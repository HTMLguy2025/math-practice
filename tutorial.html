<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="icon" href="newicon.png" type="image/x-icon">
    <script src="theme.js"></script>
    <script src="version.js"></script>
    <script src="activities.js"></script>
    <script src="tutorials.js"></script>
    <script src="tutorial-player.js"></script>
    <script src="tutorial-scenes.js"></script>
    <script src="tutorial-content-1.js"></script>
    <script src="tutorial-content-2.js"></script>
    <script src="tutorial-content-3.js"></script>
    <script src="tutorial-content-4.js"></script>
    <script src="tutorial-content-5.js"></script>
    <title>Tutorial</title>
    <style>
        * {
            font-family: 'Roboto Mono', monospace;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse 70% 50% at 15% 0%, rgba(var(--primary-rgb), 0.22), transparent 60%),
                radial-gradient(ellipse 60% 45% at 100% 100%, rgba(var(--grad-b-rgb), 0.10), transparent 60%),
                linear-gradient(rgba(var(--text-rgb), 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(var(--text-rgb), 0.035) 1px, transparent 1px);
            background-size: auto, auto, 28px 28px, 28px 28px;
            background-attachment: fixed;
            color: var(--text-body);
            min-height: 100vh;
            padding: 1rem 1.2rem 2.5rem;
        }

        [hidden] { display: none !important; }

        .tp { max-width: 820px; margin: 0 auto; }

        .tp-head { display: flex; align-items: flex-start; gap: 1.2rem; margin-bottom: 0.9rem; }

        .tp-back {
            flex-shrink: 0;
            background: none;
            border: none;
            padding: 4px 0;
            font-size: 0.9rem;
            color: rgba(var(--text-rgb), 0.6);
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }
        .tp-back:hover { color: rgba(var(--text-hi-rgb), 0.95); }

        .tp-group {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(var(--text-rgb), 0.55);
        }
        .tp-title {
            font-size: 1.6rem;
            font-weight: 600;
            line-height: 1.25;
            color: rgba(var(--text-hi-rgb), 0.97);
        }
        .tp-title::after {
            content: '';
            display: block;
            width: 64px;
            height: 3px;
            margin-top: 0.5rem;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--grad-a), var(--grad-b));
        }

        .tp-stagewrap {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(var(--trim-rgb), 0.35);
            border-radius: 12px;
            padding: 0.6rem;
        }
        .tp-stage {
            container-type: inline-size;
            width: min(100%, calc(46vh * 16 / 9));
            aspect-ratio: 16 / 9;
            margin: 0 auto;
        }
        .tp-stage svg { width: 100%; height: 100%; display: block; overflow: visible; }

        .tp-caption {
            min-height: 5.6em;
            margin: 1rem 0 0.6rem;
            font-size: 1.3rem;
            line-height: 1.5;
            color: rgba(var(--text-hi-rgb), 0.97);
            text-align: center;
        }
        .tp-caption.in { animation: tp-fade 450ms ease-out both; }

        .tp-dots { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .tp-dot {
            width: 14px; height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(var(--text-rgb), 0.45);
            background: transparent;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s, transform 0.2s;
        }
        .tp-dot.done { background: rgba(var(--accent-rgb), 0.55); border-color: rgba(var(--accent-rgb), 0.8); }
        .tp-dot.on   { background: var(--accent-hi); border-color: var(--accent-hi); transform: scale(1.25); }
        .tp-dot:focus-visible, .tp-btn:focus-visible, .tp-choice:focus-visible, .tp-mini:focus-visible {
            outline: 2px solid var(--accent-hi); outline-offset: 2px;
        }

        .tp-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; justify-content: center; }
        .tp-opts { display: flex; gap: 0.5rem; flex-wrap: wrap; width: 100%; justify-content: center; margin-top: 0.3rem; }

        .tp-btn {
            display: inline-block;
            padding: 11px 20px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: var(--btn);
            color: rgba(var(--text-hi-rgb), 0.95);
            text-decoration: none;
            cursor: pointer;
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            transition: background-color 0.2s, transform 0.15s;
        }
        .tp-btn:hover:not(:disabled) { background: var(--btn-hover); transform: translateY(-1px); }
        .tp-btn:disabled { opacity: 0.35; cursor: default; }
        .tp-primary { background: var(--primary); font-size: 1.1rem; padding: 13px 28px; }
        .tp-primary:hover:not(:disabled) { background: var(--primary-hover); }

        /* The cue: the button to press next lights up once the animation has finished */
        .tp-btn.ready {
            background: var(--primary);
            border-color: var(--accent-hi);
            color: #fff;
            box-shadow: 0 0 0 2px var(--accent-hi), 0 0 20px rgba(var(--accent-hi-rgb), 0.75);
            animation: tp-glow 1.3s ease-in-out infinite;
        }

        /* Worked lines (fractions, columns of text, colours) */
        .tp-lines {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2.4cqw;
            font-size: 5.2cqw;
            font-weight: 600;
            text-align: center;
            color: rgb(var(--text-hi-rgb));
        }
        .tp-lines.small { font-size: 4.3cqw; gap: 1.9cqw; }
        .tp-line { line-height: 1.25; text-align: center; white-space: pre-wrap; }
        .tp-line.dim { color: rgba(var(--text-rgb), 0.75); font-size: 0.82em; font-weight: 400; }
        .tp-lines sup { font-size: 0.6em; vertical-align: 0.6em; line-height: 0; }
        .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.05; margin: 0 0.12em; font-size: 0.82em; }
        .frac > .n { display: block; border-bottom: 0.09em solid currentColor; padding: 0 0.2em 0.05em; }
        .frac > .d { display: block; padding: 0.05em 0.2em 0; }
        .frac.big { font-size: 1.05em; }
        .c-a { color: #4fc3f7; } .c-b { color: #ffb74d; } .c-c { color: #81c784; } .c-d { color: #f06292; } .c-y { color: #ffd54f; }

        .tp-mini {
            padding: 5px 12px;
            font-size: 0.78rem;
            border-radius: 6px;
            border: 1px solid rgba(var(--text-rgb), 0.18);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(var(--text-rgb), 0.8);
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .tp-mini:hover { background: rgba(255, 255, 255, 0.08); }

        .tp-turnbar { text-align: center; margin-top: 1.1rem; }

        .tp-try { text-align: center; margin-top: 0.4rem; }
        .tp-qcount { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(var(--text-rgb), 0.6); margin-bottom: 0.7rem; }
        .tp-choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.8rem; }
        .tp-choice {
            min-width: 110px;
            padding: 14px 24px;
            font-size: 1.6rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: var(--btn);
            color: rgba(var(--text-hi-rgb), 0.97);
            cursor: pointer;
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            transition: background-color 0.15s, transform 0.15s;
        }
        .tp-choice:hover:not(:disabled) { background: var(--btn-hover); transform: translateY(-1px); }
        .tp-choice.right { background: rgb(79, 117, 63); }
        .tp-choice.wrong { background: rgb(120, 45, 45); animation: tp-shake 350ms; }
        .tp-choice:disabled { cursor: default; }
        .tp-feedback { min-height: 3.2em; margin-top: 0.9rem; font-size: 1.05rem; line-height: 1.45; }
        .tp-feedback.ok  { color: rgba(140, 225, 160, 0.98); }
        .tp-feedback.bad { color: rgba(255, 200, 140, 0.98); }
        .tp-endrow { display: flex; flex-wrap: wrap; gap: 0.8rem; justify-content: center; margin-top: 0.5rem; }

        .tp-missing { font-size: 1.1rem; margin: 2rem 0 1rem; }

        /* scene animations */
        @keyframes tp-pop   { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.18); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes tp-fade  { from { opacity: 0; } to { opacity: 1; } }
        @keyframes tp-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
        @keyframes tp-draw  { from { stroke-dashoffset: var(--len, 600); } to { stroke-dashoffset: 0; } }
        @keyframes tp-glow  { 0%, 100% { box-shadow: 0 0 0 2px var(--accent-hi), 0 0 8px rgba(var(--accent-hi-rgb), 0.35); } 50% { box-shadow: 0 0 0 2px var(--accent-hi), 0 0 24px rgba(var(--accent-hi-rgb), 0.95); } }
        @keyframes tp-rise  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes tp-grow  { from { transform: scaleY(0); } to { transform: scaleY(1); } }
        @keyframes tp-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

        @media (max-width: 560px) {
            body { padding: 0.8rem 0.8rem 2rem; }
            .tp-title { font-size: 1.25rem; }
            .tp-caption { font-size: 1.1rem; min-height: 7em; }
            .tp-btn { padding: 10px 14px; font-size: 0.9rem; }
            .tp-choice { font-size: 1.3rem; min-width: 90px; padding: 12px 16px; }
            .tp-stage { width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            .tp-caption.in, .tp-dot, .tp-btn, .tp-choice { animation: none; transition: none; }
            .tp-btn.ready { animation: none; }
        }

        body.embed { padding: 0.7rem 1rem 1.2rem; }
    </style>
</head>
<body>
    <main class="tp" id="app"></main>
    <script>
        (() => {
            const params = new URLSearchParams(location.search);
            const topic = params.get('topic');
            const embed = params.get('embed') === '1' && window.self !== window.top;
            if (embed) document.body.classList.add('embed');
            const onClose = () => { try { window.parent.postMessage({ type: 'tutorial:close' }, '*'); } catch (e) {} };
            const app = document.getElementById('app');

            // The coach (hints and "show me how") hands over a worked example for one question.
            if (params.get('coach') === '1' && embed && window.parent.MPCoach) {
                const L = window.parent.MPCoach.frameLesson();
                if (L) {
                    document.title = L.title;
                    MPTutorialPlayer.start(app, 'coach', {
                        embed, coach: true, onClose,
                        topic: { id: 'coach', group: 'Let’s work it out', title: L.title },
                        lesson: { steps: L.steps },
                    });
                    return;
                }
            }

            const t = MPTutorials.topic(topic);
            if (t) document.title = t.title;
            MPTutorialPlayer.start(app, topic, { embed, onClose });
        })();
    </script>
</body>
</html>
